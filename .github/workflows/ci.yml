name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install dependencies
        run: npm ci

      - name: Install F# tools
        run: dotnet tool restore

      - name: Check F# formatting
        run: npm run lint

      - name: Check dependency licenses
        run: npm run license-check

      - name: Check markdown formatting
        run: npm run md-lint

      - name: Run F# Scriptorium tests
        run: npm test

      - name: Build extension and CLI
        run: npm run compile

  # F# analyzer check (fsharp-analyzers + G-Research rules), mirroring how Fable runs its own.
  # Soft-gated: the AnalyzeFSharpProject target ignores the CLI exit code, so the job succeeds
  # whenever analysis runs and produces a SARIF -- findings never fail the build. It fails loudly
  # (via the verify step) on a real restore/build/analysis error instead of hiding it, as a
  # bare continue-on-error would. SARIF uploads to GitHub Code Scanning for triage over time.
  # To make this blocking once the backlog clears, replace the verify step with a check that
  # fails when results are non-empty.
  fsharp-analyzers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/EnergyState.fsproj
          - cli/EnergyState.Cli.fsproj
          - tests/EnergyState.Tests.fsproj
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install F# tools
        run: dotnet tool restore

      - name: Restore and run fsharp-analyzers on ${{ matrix.project }}
        run: |
          dotnet restore ${{ matrix.project }}
          dotnet msbuild /t:AnalyzeFSharpProject ${{ matrix.project }}

      - name: Verify analyzer report exists
        run: |
          if ls fsharp-analyzer-reports/*.sarif >/dev/null 2>&1; then
            echo "report present:"
            ls -la fsharp-analyzer-reports/
          else
            echo "ERROR: no SARIF produced for ${{ matrix.project }}" >&2
            ls -la fsharp-analyzer-reports 2>/dev/null || echo "(reports dir missing)" >&2
            exit 1
          fi

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fsharp-analyzer-reports/**/*.sarif
          category: ${{ matrix.project }}
