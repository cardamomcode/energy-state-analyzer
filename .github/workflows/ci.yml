name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install dependencies
        run: npm ci

      - name: Install F# tools
        run: dotnet tool restore

      - name: Check F# formatting
        run: npm run lint

      - name: Check dependency licenses
        run: npm run license-check

      - name: Check markdown formatting
        run: npm run md-lint

      - name: Run F# Scriptorium tests
        run: npm test

      - name: Build extension and CLI
        run: npm run compile

  # F# analyzer check (fsharp-analyzers + G-Research rules), mirroring how Fable runs its own.
  # Soft-gated (continue-on-error) with SARIF upload to GitHub Code Scanning so findings are
  # triaged over time instead of hard-failing PRs on day one. Once the backlog clears, drop the
  # continue-on-error line to turn this into a blocking check.
  fsharp-analyzers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - src/EnergyState.fsproj
          - cli/EnergyState.Cli.fsproj
          - tests/EnergyState.Tests.fsproj
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install F# tools
        run: dotnet tool restore

      - name: Run fsharp-analyzers on ${{ matrix.project }}
        run: |
          dotnet restore ${{ matrix.project }}
          dotnet msbuild /t:AnalyzeFSharpProject ${{ matrix.project }}
        continue-on-error: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: fsharp-analyzer-reports
          category: ${{ matrix.project }}
