name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install dependencies
        run: npm ci

      - name: Install F# tools
        run: dotnet tool restore

      - name: Check F# formatting
        run: npm run lint

      - name: Check dependency licenses
        run: npm run license-check

      - name: Run F# Scriptorium tests
        run: npm test

      - name: Build extension and CLI
        run: npm run compile
