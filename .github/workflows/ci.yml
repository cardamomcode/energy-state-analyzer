name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and lint
        run: npm run pretest

      - name: Check dependency licenses
        run: npm run license-check

      - name: Run tests
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test
