name: Energy state diff

on:
  pull_request:
    branches: [main]

jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - name: Install dependencies
        run: npm ci

      - name: Install F# tools
        run: dotnet tool restore

      - name: Build CLI
        run: npm run compile

      - name: Run energy state diff
        run: node dist/cli.js --base-ref "origin/${{ github.base_ref }}" --report md > energy-diff.md

      - name: Prepare energy state diff artifact
        if: always()
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          artifact_dir="$RUNNER_TEMP/energy-state-diff"
          mkdir -p "$artifact_dir"
          printf '%s\n' "$PR_NUMBER" > "$artifact_dir/pr-number"
          if [ -f energy-diff.md ]; then
            cp energy-diff.md "$artifact_dir/energy-diff.md"
          else
            printf '# Energy State Report\n\nThe report could not be generated. See the workflow logs.\n' > "$artifact_dir/energy-diff.md"
          fi

      - name: Upload energy state diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: energy-state-diff
          path: ${{ runner.temp }}/energy-state-diff
          if-no-files-found: error
