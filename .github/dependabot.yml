version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # G-Research.FSharp.Analyzers 0.25.0 is built with fsharp-analyzers 0.39.0, so only the
    # 0.39.0 host loads it (the CLI requires an exact SDK match). Do not adopt another host
    # version until G-Research ships a rule package built against that SDK.
    ignore:
      - dependency-name: "fsharp-analyzers"
        versions: ["0.38.0", "0.39.1", "0.39.2"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
