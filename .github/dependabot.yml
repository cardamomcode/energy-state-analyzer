version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    # G-Research.FSharp.Analyzers 0.23.0 is built with fsharp-analyzers 0.37.2.
    # Do not update the host until G-Research ships a compatible rule package.
    ignore:
      - dependency-name: "fsharp-analyzers"
        versions: ["0.38.0"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
